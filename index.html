<style>

    #webcam { display: none; }
    
    .status { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; transition: opacity 0.3s; z-index: 10; }

    .stream-hint.hidden { opacity: 0; pointer-events: none; }

    .addon-box { background: rgba(255,255,255,0.1); padding: 6px; border-radius: 4px; margin-top: 6px; }

    .credit-display {

    }
</style>

        </div>

<script>
const SOURCE_W = 1000, SOURCE_H = 860;

const CHARACTERS = {
    reimu: {
        label: '霊夢',
        assetBase: 'assets_reimu/',
        fixedParts: { body: '00', hair: '00', fuku: '01' },
        expressionMap: {
            normal:   { brow: '00', eye: '00', mouth: '00', face: '00' },
            smile:    { brow: '00', eye: '00', mouth: '05', face: '00' },
            surprised:{ brow: '07', eye: '00', mouth: '00', face: '00' },
            angry:    { brow: '06', eye: '00', mouth: '03', face: '00' },
            sad:      { brow: '05', eye: '00', mouth: '02', face: '00' },
        },
        anchor: { x: 0.50, y: 0.52 },
        eyeSplitX: 460,
    },
    marisa: {
        label: '魔理沙',
        assetBase: 'assets_marisa/',
        fixedParts: { body: '00', hair: '00', fuku: '01' },
        expressionMap: {
            normal:   { brow: '00', eye: '00', mouth: '00', face: '00' },
            smile:    { brow: '00', eye: '00', mouth: '05', face: '00' },
            surprised:{ brow: '07', eye: '00', mouth: '00', face: '00' },
            angry:    { brow: '06', eye: '00', mouth: '03', face: '00' },
            sad:      { brow: '05', eye: '00', mouth: '02', face: '00' },
        },
        anchor: { x: 0.50, y: 0.52 },
        eyeSplitX: 460,
    },
};

class AssetLoader {
    constructor(sourceType, sourceData) {
        this.sourceType = sourceType; 
        this.sourceData = sourceData; 
        this.cache = {};
        this.total = 0;
        this.loaded = 0;
    }
    
    get(path) {
        if (this.cache[path]) return this.cache[path];
        const img = new Image();
        this.total++;
        
        if (this.sourceType === 'folder') {
            img.onload = () => { this.loaded++; };
            img.onerror = () => { this.loaded++; };
            img.src = this.sourceData + path;
        } else if (this.sourceType === 'addon') {
            img.onload = () => { this.loaded++; };
            img.onerror = () => { this.loaded++; };
            
            const zipPath = (path.startsWith('/') ? path.slice(1) : path);
            const zipFile = this.sourceData.file(zipPath) || this.sourceData.file(path);
            
            if (zipFile) {
                zipFile.async('blob').then(blob => {
                    img.src = URL.createObjectURL(blob);
                }).catch(err => {});
            } else {
                this.loaded++;
            }
        }
        
        this.cache[path] = img;
        return img;
    }
    
    get isDone() { return this.loaded >= this.total; }

    preloadAll() {
        this.get('body_00.png');
        this.get('body_01.png');
        ['00','01','02','03','04','05','06','07'].forEach(n => this.get(`brow_${n}.png`));
        for (let i = 0; i <= 15; i++) {
            const id = String(i).padStart(2, '0');
            for (let j = 0; j <= 4; j++) this.get(`eye_${id}.${j}.png`);
        }
        for (let i = 0; i <= 9; i++) {
            const id = String(i).padStart(2, '0');
            for (let j = 0; j <= 4; j++) this.get(`mouth_${id}.${j}.png`);
        }
        for (let i = 0; i <= 6; i++) this.get(`face_0${i}.png`);
        for (let i = 0; i <= 4; i++) this.get(`hair_0${i}.png`);
        for (let i = 1; i <= 4; i++) this.get(`fuku_0${i}.png`);
    }
}

const loaders = {};
function initLoaders() {
    for (const key of Object.keys(CHARACTERS)) {
        if (!loaders[key]) {
            const c = CHARACTERS[key];
            if (c.zipData) {
                loaders[key] = new AssetLoader('addon', c.zipData);
            } else {
                loaders[key] = new AssetLoader('folder', c.assetBase);
            }
            loaders[key].preloadAll();
        }
    }
}
initLoaders();

function computeExpressionFeatures(lm, canvasW, canvasH) {
    const px = (i) => lm[i].x * canvasW;
    const py = (i) => lm[i].y * canvasH;

    const forehead = { x: px(10), y: py(10) };
    const chin = { x: px(152), y: py(152) };
    const faceH = Math.hypot(forehead.x - chin.x, forehead.y - chin.y);

    const eyeOpenL = Math.abs(py(145) - py(159)) / faceH;
    const eyeOpenR = Math.abs(py(374) - py(386)) / faceH;
    const mouthOpenV = Math.abs(py(14) - py(13)) / faceH;

    const mouthCenterY = (py(13) + py(14)) / 2;
    const cornerL = py(61), cornerR = py(291);
    const mouthCornerRaise = (mouthCenterY - (cornerL + cornerR) / 2) / faceH;

    const browY = (py(105) + py(334)) / 2;
    const eyeY = (py(159) + py(386)) / 2;
    const browRaise = (eyeY - browY) / faceH;

    return { faceH, eyeOpenL, eyeOpenR, mouthOpenV, mouthCornerRaise, browRaise };
}

function classifyExpression(f, sensitivity) {
    const s = sensitivity;
    const SMILE_TH = 0.010 / s;
    const SURPRISE_MOUTH_TH = 0.07 / s;
    const SURPRISE_BROW_TH = 0.145 / s;
    const ANGRY_BROW_TH = 0.085 / s;
    const SAD_MOUTH_TH = -0.006 / s;

    if (f.mouthOpenV > SURPRISE_MOUTH_TH && f.browRaise > SURPRISE_BROW_TH) return 'surprised';
    if (f.mouthCornerRaise > SMILE_TH) return 'smile';
    if (f.browRaise < ANGRY_BROW_TH && f.mouthCornerRaise < 0) return 'angry';
    if (f.mouthCornerRaise < SAD_MOUTH_TH) return 'sad';
    return 'normal';
}

class FaceState {
    constructor(smoothness) {
        this.smoothness = smoothness;
        this.x = 320; this.y = 240; this.scale = 300; this.angle = 0;
        this.eyeOpenL = 1.0;
        this.eyeOpenR = 1.0;
        this.mouthOpenV = 0.02;
        this.expression = 'normal';
        this.exprHoldFrames = 0;
        this.pendingExpr = 'normal';
        this.isFront = true;
        this.isFacingRight = true;
        this.active = true;
    }
    update(target, targetExpr, isFront, isFacingRight) {
        this.active = true;
        this.isFront = isFront;
        this.isFacingRight = isFacingRight;
        const s = this.smoothness;

        this.x += (target.x - this.x) * s;
        this.y += (target.y - this.y) * s;
        this.scale += (target.scale - this.scale) * s;
        
        let diffAngle = target.angle - this.angle;
        while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
        while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
        this.angle += diffAngle * s;

        this.eyeOpenL += (target.eyeOpenL - this.eyeOpenL) * s;
        this.eyeOpenR += (target.eyeOpenR - this.eyeOpenR) * s;
        this.mouthOpenV += (target.mouthOpenV - this.mouthOpenV) * s;

        if (targetExpr === this.pendingExpr) {
            this.exprHoldFrames++;
        } else {
            this.pendingExpr = targetExpr;
            this.exprHoldFrames = 0;
        }
        if (this.exprHoldFrames >= 3 && this.expression !== targetExpr) {
            this.expression = targetExpr;
        }
    }
}

class AvatarRenderer {
    constructor(ctx) {
        this.ctx = ctx;
        this.buffer = document.createElement('canvas');
        this.buffer.width = SOURCE_W;
        this.buffer.height = SOURCE_H;
        this.bctx = this.buffer.getContext('2d');
    }

    static toFrameIndex(ratio) {
        const v = Math.min(1, Math.max(0, ratio));
        return Math.round(v * 4);
    }

    render(state, expr, charKey) {
        const charDef = CHARACTERS[charKey];
        const assets = loaders[charKey];
        if (!assets) return;
        
        const map = charDef.expressionMap[expr] || charDef.expressionMap.normal;
        const bctx = this.bctx;
        bctx.clearRect(0, 0, SOURCE_W, SOURCE_H);

        const eyeFrameL = AvatarRenderer.toFrameIndex(state.eyeOpenL);
        const eyeFrameR = AvatarRenderer.toFrameIndex(state.eyeOpenR);
        const MOUTH_MIN = 0.015, MOUTH_MAX = 0.09;
        const mouthRatio = (state.mouthOpenV - MOUTH_MIN) / (MOUTH_MAX - MOUTH_MIN);
        const mouthFrame = AvatarRenderer.toFrameIndex(mouthRatio);

        const bodyImg = assets.get(`body_${charDef.fixedParts.body}.png`);
        const faceImg = assets.get(`face_${map.face}.png`);
        const browImg = assets.get(`brow_${map.brow}.png`);
        const mouthImg = assets.get(`mouth_${map.mouth}.${mouthFrame}.png`);
        const hairImg = assets.get(`hair_${charDef.fixedParts.hair}.png`);
        const fukuImg = assets.get(`fuku_${charDef.fixedParts.fuku}.png`);

        const drawIfReady = (img) => {
            if (img && img.complete && img.naturalWidth > 0) {
                bctx.drawImage(img, 0, 0, SOURCE_W, SOURCE_H);
            }
        };

        drawIfReady(bodyImg);
        drawIfReady(faceImg);
        drawIfReady(browImg);

        const eyeImgL = assets.get(`eye_${map.eye}.${eyeFrameL}.png`);
        const eyeImgR = assets.get(`eye_${map.eye}.${eyeFrameR}.png`);
        const splitX = charDef.eyeSplitX;
        if (eyeImgL && eyeImgL.complete && eyeImgL.naturalWidth > 0) {
            bctx.save();
            bctx.beginPath();
            bctx.rect(0, 0, splitX, SOURCE_H);
            bctx.clip();
            bctx.drawImage(eyeImgL, 0, 0, SOURCE_W, SOURCE_H);
            bctx.restore();
        }
        if (eyeImgR && eyeImgR.complete && eyeImgR.naturalWidth > 0) {
            bctx.save();
            bctx.beginPath();
            bctx.rect(splitX, 0, SOURCE_W - splitX, SOURCE_H);
            bctx.clip();
            bctx.drawImage(eyeImgR, 0, 0, SOURCE_W, SOURCE_H);
            bctx.restore();
        }

        drawIfReady(mouthImg);
        drawIfReady(hairImg);
        drawIfReady(fukuImg);

        const drawW = state.scale;
        const drawH = state.scale * (SOURCE_H / SOURCE_W);

        this.ctx.save();
        this.ctx.translate(state.x, state.y);
        this.ctx.rotate(state.angle);

        if (!state.isFacingRight) {
            this.ctx.scale(-1, 1);
        }

        const drawX = -drawW * charDef.anchor.x;
        const drawY = -drawH * charDef.anchor.y;
        this.ctx.drawImage(this.buffer, drawX, drawY, drawW, drawH);
        this.ctx.restore();
    }
}

class App {
    constructor() {
        this.video = document.getElementById('webcam');
        this.canvas = document.getElementById('output_canvas');
        this.ctx = this.canvas.getContext('2d');
        this.statusEl = document.getElementById('status');
        this.exprBadge = document.getElementById('exprBadge');
        this.controlPanel = document.getElementById('controlPanel');
        this.streamHint = document.getElementById('streamHint');

        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        this.faceStates = [new FaceState(0.25), new FaceState(0.25), new FaceState(0.25)];
        this.renderer = new AvatarRenderer(this.ctx);

        this.currentChars = ['reimu', 'marisa', 'reimu']; 
        
        this.maxFacesSetting = 3;
        this.userScale = 1.85;
        this.offX = 0;
        this.offY = -0.02;
        this.sensitivity = 1.0;
        this.hideOnLost = false;
        this.blurOnLost = true;
        this.streamMode = false;
        
        this.bindPanel();
        this.bindAddonLoader();

        this.faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        this.faceMesh.setOptions({
            maxNumFaces: 3,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        this.faceMesh.onResults((results) => this.onResults(results));

        this.camera = new Camera(this.video, {
            onFrame: async () => { await this.faceMesh.send({ image: this.video }); },
            width: 1280,
            height: 720
        });
    }

    resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    bindPanel() {
        document.getElementById('p_char_0').addEventListener('change', (e) => { this.currentChars[0] = e.target.value; });
        document.getElementById('p_char_1').addEventListener('change', (e) => { this.currentChars[1] = e.target.value; });
        document.getElementById('p_char_2').addEventListener('change', (e) => { this.currentChars[2] = e.target.value; });
        
        document.getElementById('p_maxFaces').addEventListener('change', (e) => {
            this.maxFacesSetting = parseInt(e.target.value, 10);
        });
        document.getElementById('p_scale').addEventListener('input', (e) => { this.userScale = parseFloat(e.target.value); });
        document.getElementById('p_offX').addEventListener('input', (e) => { this.offX = parseFloat(e.target.value); });
        document.getElementById('p_offY').addEventListener('input', (e) => { this.offY = parseFloat(e.target.value); });
        document.getElementById('p_sens').addEventListener('input', (e) => { this.sensitivity = parseFloat(e.target.value); });
        document.getElementById('p_hideOnLost').addEventListener('change', (e) => { this.hideOnLost = e.target.checked; });
        document.getElementById('p_blurOnLost').addEventListener('change', (e) => { this.blurOnLost = e.target.checked; });
        
        const streamChk = document.getElementById('p_streamMode');
        streamChk.addEventListener('change', (e) => {
            this.streamMode = e.target.checked;
            this.updateStreamModeUI();
        });

        this.canvas.addEventListener('click', () => {
            this.streamMode = !this.streamMode;
            streamChk.checked = this.streamMode;
            this.updateStreamModeUI();
        });
    }

    bindAddonLoader() {
        const loadBtn = document.getElementById('loadAddonBtn');
        const fileInput = document.getElementById('addonFile');

        loadBtn.addEventListener('click', async () => {
            if (!fileInput.files.length) {
                alert('.yukuriaabata ファイルを選択してください。');
                return;
            }
            const file = fileInput.files[0];
            try {
                this.statusEl.textContent = 'アドオンを読み込んでいます...';
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                let manifestFile = zipContent.file('manifest.json') || zipContent.file('character.json');
                let charConfig = {
                    key: 'addon_' + Date.now(),
                    label: file.name.replace(/\.[^/.]+$/, ''),
                    fixedParts: { body: '00', hair: '00', fuku: '01' },
                    expressionMap: {
                        normal:   { brow: '00', eye: '00', mouth: '00', face: '00' },
                        smile:    { brow: '00', eye: '00', mouth: '05', face: '00' },
                        surprised:{ brow: '07', eye: '00', mouth: '00', face: '00' },
                        angry:    { brow: '06', eye: '00', mouth: '03', face: '00' },
                        sad:      { brow: '05', eye: '00', mouth: '02', face: '00' },
                    },
                    anchor: { x: 0.50, y: 0.52 },
                    eyeSplitX: 460
                };

                if (manifestFile) {
                    const jsonText = await manifestFile.async('text');
                    const parsed = JSON.parse(jsonText);
                    Object.assign(charConfig, parsed);
                }

                charConfig.zipData = zipContent;
                CHARACTERS[charConfig.key] = charConfig;

                loaders[charConfig.key] = new AssetLoader('addon', zipContent);
                loaders[charConfig.key].preloadAll();

                [0, 1, 2].forEach(i => {
                    const charSelect = document.getElementById(`p_char_${i}`);
                    const opt = document.createElement('option');
                    opt.value = charConfig.key;
                    opt.textContent = charConfig.label + ' (アドオン)';
                    charSelect.appendChild(opt);
                });

                document.getElementById('p_char_0').value = charConfig.key;
                this.currentChars[0] = charConfig.key;

                this.statusEl.textContent = `アドオン「${charConfig.label}」を追加しました！`;
                setTimeout(() => { this.statusEl.textContent = '準備完了'; }, 3000);
            } catch (err) {
                console.error(err);
                alert('アドオンの読み込みに失敗しました。ファイル形式を確認してください。');
                this.statusEl.textContent = '読み込みエラー';
            }
        });
    }

    updateStreamModeUI() {
        if (this.streamMode) {
            this.controlPanel.classList.add('hidden');
            this.statusEl.classList.add('hidden');
            this.exprBadge.classList.add('hidden');
            this.streamHint.classList.add('hidden');
        } else {
            this.controlPanel.classList.remove('hidden');
            this.statusEl.classList.remove('hidden');
            this.exprBadge.classList.remove('hidden');
            this.streamHint.classList.remove('hidden');
        }
    }

    start() {
        this.camera.start().catch(err => {
            this.statusEl.textContent = 'カメラエラー: ' + err.message;
        });
    }

    drawBackground(image, blur = false) {
        const ctx = this.ctx;
        const w = this.canvas.width, h = this.canvas.height;
        ctx.save();
        ctx.clearRect(0, 0, w, h);
        if (blur) {
            ctx.filter = 'blur(35px)';
        } else {
            ctx.filter = 'none';
        }
        ctx.drawImage(image, 0, 0, w, h);
        ctx.restore();
    }

    drawHiddenBackground() {
        const ctx = this.ctx;
        const w = this.canvas.width, h = this.canvas.height;
        ctx.save();
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, w, h);
        if (!this.streamMode) {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.translate(w, 0);
            ctx.scale(-1, 1);
            ctx.fillText('顔を検出できません(映像を非表示中)', w / 2, h / 2);
        }
        ctx.restore();
    }

    onResults(results) {
        const rawFaces = results.multiFaceLandmarks || [];
        const faceFound = rawFaces.length > 0;
        const activeCount = Math.min(rawFaces.length, this.maxFacesSetting);

        for(let s of this.faceStates) s.active = false;

        if (!faceFound) {
            if (this.hideOnLost) {
                this.drawHiddenBackground();
            } else {
                this.drawBackground(results.image, this.blurOnLost);
            }
            this.statusEl.textContent = '顔が検知されていません';
            this.exprBadge.textContent = '0 faces';
            return;
        }

        this.drawBackground(results.image, false);
        this.statusEl.textContent = `${activeCount}人トラッキング中`;
        this.exprBadge.textContent = `${activeCount} faces`;

        const w = this.canvas.width, h = this.canvas.height;

        for (let i = 0; i < activeCount; i++) {
            const charKey = this.currentChars[i] || 'reimu';
            const loader = loaders[charKey];
            
            const lm = rawFaces[i];
            const state = this.faceStates[i];

            const nose = lm[1];
            const forehead = lm[10];
            const chin = lm[152];
            const faceH = Math.hypot((forehead.x - chin.x) * w, (forehead.y - chin.y) * h);

            const eyeL = lm[33];
            const eyeR = lm[263];
            const dx = (eyeR.x - eyeL.x) * w;
            const dy = (eyeR.y - eyeL.y) * h;
            const targetAngle = Math.atan2(dy, dx);

            const zDiff = lm[33].z - lm[263].z; 
            const isFacingRight = zDiff > 0; 

            const eyeDistance = Math.hypot((eyeR.x - eyeL.x) * w, (eyeR.y - eyeL.y) * h);
            const eyeRatio = eyeDistance / faceH;
            const isFront = eyeRatio > 0.25; 

            const target = {
                x: nose.x * w + this.offX * w,
                y: nose.y * h + this.offY * h,
                scale: faceH * this.userScale * (SOURCE_W / SOURCE_H) * 0.9,
                angle: targetAngle,
                eyeOpenL: 0,
                eyeOpenR: 0,
                mouthOpenV: 0,
            };

            const feat = computeExpressionFeatures(lm, w, h);
            const normEye = (v) => v > 0.06 ? 1 : Math.max(0, Math.min(1, v / 0.06));
            target.eyeOpenL = normEye(feat.eyeOpenR);
            target.eyeOpenR = normEye(feat.eyeOpenL);
            target.mouthOpenV = feat.mouthOpenV;

            const expr = classifyExpression(feat, this.sensitivity);
            
            state.update(target, expr, isFront, isFacingRight);

            if (loader && loader.isDone) {
                this.renderer.render(state, state.expression, charKey);
            }
        }
    }
}

window.addEventListener('load', () => {
    const app = new App();
    const allDone = () => Object.values(loaders).every(l => l && l.isDone);
    const waitForAssets = setInterval(() => {
        if (allDone()) {
            clearInterval(waitForAssets);
            document.getElementById('status').textContent = 'カメラを起動中...';
            app.start();
        }
    }, 100);
    setTimeout(() => {
        clearInterval(waitForAssets);
        document.getElementById('status').textContent = 'カメラを起動中...';
        app.start();
    }, 6000);
});
</script>
